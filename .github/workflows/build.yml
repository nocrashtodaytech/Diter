name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'Diter-v*'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Bundle renderer
        run: npm run build

      - name: Package Windows (NSIS)
        run: npx electron-builder --win nsis --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diter-Windows-x64
          path: |
            release/*.exe
            release/*.blockmap

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Bundle renderer
        run: npm run build

      - name: Package macOS (DMG)
        run: npx electron-builder --mac --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diter-macOS
          path: release/*.dmg

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Bundle renderer
        run: npm run build

      - name: Package Linux (AppImage + deb)
        run: npx electron-builder --linux --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diter-Linux
          path: |
            release/*.AppImage
            release/*.deb
